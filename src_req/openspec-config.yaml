# Черновик будущего openspec/config.yaml продукта AV Control.
# Скопировать в корень планирования продукта после openspec init.
# Не класть в клон CLI: AV Control WEB_UI/openspec/openspec/config.yaml.

schema: spec-driven

context: |
  Language: Russian (ru)
  Команда русскоязычная. Все рабочие тексты писать по-русски.
  Английский оставлять только там, где без него OpenSpec не проверяет документ,
  и для устойчивых терминов из списка ниже.

  Это правило действует на:
  - четыре артефакта изменения: proposal.md, specs/**/spec.md, design.md, tasks.md
  - исходные описания в src_req/
  - комментарии в коде продукта

  На английском оставлять только:
  - заголовки ## Why, ## What Changes, ## Capabilities, ## Impact
  - заголовки ## Purpose, ## ADDED Requirements, ## MODIFIED Requirements, ## REMOVED Requirements, ## RENAMED Requirements
  - заголовки ### Requirement и #### Scenario
  - ключевые слова SHALL и MUST
  - метки WHEN и THEN
  - пути файлов, имена API, идентификаторы кода и фрагменты кода
  - устойчивые термины: UI, API, HTTP

  Имена в kebab-case, snake_case и camelCase в тексте не оставлять английскими ярлыками.
  Рядом с таким именем давать русское описание. Само имя пути можно сохранить,
  если это путь файла или каталога, без которого OpenSpec не найдёт артефакт.

  Пример:
  - capability path: source-select
  - описание: выбор источника сигнала

rules:
  proposal:
    - Писать текст разделов по-русски. Заголовки Why, What Changes, Capabilities и Impact не переводить.
    - Английский в тексте: только SHALL/MUST при необходимости, пути, имена API, код и термины UI, API, HTTP.
    - Имя capability в kebab-case сопровождать русским описанием. Не заменять описание английским ярлыком.
  specs:
    - Писать назначение, требования и сценарии по-русски.
    - Не переводить заголовки Purpose, ADDED/MODIFIED/REMOVED/RENAMED Requirements, Requirement и Scenario.
    - Не переводить SHALL, MUST, WHEN и THEN.
    - В тексте требования не оставлять kebab-case, snake_case и camelCase без русского описания.
  design:
    - Писать контекст, цели, решения и риски по-русски.
    - Английский оставлять для путей, имён API, кода и терминов UI, API, HTTP.
    - Технические идентификаторы сопровождать русским описанием.
  tasks:
    - Писать формулировки задач и способ проверки по-русски.
    - Не переводить разметку чекбоксов и номера задач.
    - В задаче на код требовать комментарии по-русски с теми же исключениями, что в context.

operations:
  apply:
    guidance:
      - Комментарии в новом и изменённом коде писать по-русски.
      - В комментариях английский допустим для путей, имён API, идентификаторов кода и терминов UI, API, HTTP.
      - kebab-case, snake_case и camelCase в комментарии сопровождать русским описанием.
